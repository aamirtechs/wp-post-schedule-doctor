[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-post-schedule-doctor"
version = "1.0.0"
description = "Audit a WordPress posts CSV export for missed schedules and scheduling problems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
wp-post-schedule-doctor = "wp_post_schedule_doctor:main_entry"

[tool.setuptools]
py-modules = ["wp_post_schedule_doctor"]
